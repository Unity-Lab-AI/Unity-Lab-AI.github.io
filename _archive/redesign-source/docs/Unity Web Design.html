<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0000">
  <title>Unity Web Design — internal · v0.1 draft</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tokens + production component styles (so live demos inherit the real thing) -->
  <link rel="stylesheet" href="../redesign/shared-tokens.css">
  <link rel="stylesheet" href="../redesign/variations.css?v=15">
  <link rel="stylesheet" href="../redesign/unity-web-design.css?v=2">

  <style>
    html, body { margin: 0; padding: 0; background: #050000; }
    body { -webkit-font-smoothing: antialiased; }
    *:focus-visible {
      outline: 2px solid var(--crimson-red);
      outline-offset: 3px;
    }
    @keyframes uwd-blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    /* skip link */
    .uwd-skip {
      position: absolute; left: -9999px; top: 0;
      background: var(--crimson-red); color: var(--bone);
      padding: 12px 20px; font: 700 12px/1 var(--font-mono);
      letter-spacing: 4px; z-index: 9999;
      text-decoration: none;
    }
    .uwd-skip:focus { left: 16px; top: 16px; outline: 2px solid var(--bone); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared bits -->
  <script type="text/babel" src="../redesign/sigils.jsx"></script>

  <!-- Docs primitives + sections -->
  <script type="text/babel" src="../redesign/uwd-helpers.jsx"></script>
  <script type="text/babel" src="../redesign/uwd-page.jsx"></script>
  <script type="text/babel" src="../redesign/uwd-page-2.jsx"></script>
</head>
<body class="uwd">
  <a href="#main-content" class="uwd-skip">Skip to content</a>

  <div id="root"></div>

  <script type="text/babel">
    const {
      UwdTopbar, UwdCover,
      UwdFoundations, UwdLayout, UwdIconography,
      UwdBrand, UwdComponents, UwdMotion, UwdA11y, UwdChangelog,
      Sigils,
    } = window;

    function App() {
      return (
        <>
          <UwdTopbar />
          <main id="main-content">
            <UwdCover />
            <UwdFoundations />
            <UwdLayout />
            <UwdIconography />
            <UwdBrand />
            <UwdComponents />
            <UwdMotion />
            <UwdA11y />
            <UwdChangelog />
            <footer className="uwd-colophon">
              <div className="uwd-colophon-orn">
                <span></span>
                <Sigils.Cross size={16} />
                <span></span>
              </div>
              <h2>End of Ledger</h2>
              <p>
                This document is internal. It changes when we change. If you carve a new
                token, a new component, or a new motion law — write it down here, then
                bump the version above.
              </p>
              <div className="uwd-colophon-meta">
                Unity Web Design · v0.1 · maintained by the lab · last carved 2026 · 04
              </div>
            </footer>
          </main>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
