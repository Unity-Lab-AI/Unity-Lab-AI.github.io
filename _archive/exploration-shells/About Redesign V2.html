<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About — V2 (Fused) · Unity AI Lab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />

  <link rel="stylesheet" href="redesign/shared-tokens.css" />
  <link rel="stylesheet" href="redesign/about.css" />
  <link rel="stylesheet" href="redesign/about-v2.css" />

  <style>
    html, body { margin: 0; background: #f0eee9; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    #root { width: 100vw; min-height: 100vh; }
    .ab-artboard { width: 100%; min-height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Canvas + content -->
  <script type="text/babel" src="redesign/design-canvas.jsx"></script>
  <script type="text/babel" src="redesign/sigils.jsx"></script>
  <script type="text/babel" src="redesign/about-data.jsx"></script>
  <script type="text/babel" src="redesign/about-shared.jsx"></script>

  <!-- V2 component -->
  <script type="text/babel" src="redesign/about-v2.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { DesignCanvas, DCSection, DCArtboard, AboutV2 } = window;

    const W = 1240;
    const H = 4400;

    const App = () => (
      <DesignCanvas projectName="ABOUT V2 · FUSED · CODEX 00">
        <DCSection
          id="about-v2"
          title="About page · V2 (fused)"
          subtitle="Cathedral canvas + Dossier chrome + Reliquary cards + Manifest tables. The best of the four."
        >
          <DCArtboard id="aV2" label="V2 — fused" width={W} height={H}>
            <div className="ab-page"><AboutV2 /></div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
