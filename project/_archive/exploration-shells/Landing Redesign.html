<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unity AI Lab — Redesign Variations</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="redesign/shared-tokens.css">
<link rel="stylesheet" href="redesign/variations.css">

<style>
  body { background: #060606; }
  .dc-artboard { background: var(--primary-black); }
  .artboard-section { padding: 0; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="redesign/sigils.jsx"></script>
<script type="text/babel" src="redesign/v-a.jsx"></script>
<script type="text/babel" src="redesign/v-b.jsx"></script>
<script type="text/babel" src="redesign/v-c.jsx"></script>
<script type="text/babel" src="redesign/v-d.jsx"></script>
<script type="text/babel" src="redesign/shared-sections.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const { TerminalHero, EditorialHero, LiveDemoHero, GothicHero,
        LibraryShowcase, WhyWeBuilt, SocialProof, FooterArtifact } = window;

const ArtboardWrap = ({ children }) => (
  <div style={{ background: 'var(--primary-black)', minHeight: '100%' }}>
    {children}
    <LibraryShowcase />
    <WhyWeBuilt />
    <SocialProof />
    <FooterArtifact />
  </div>
);

const App = () => (
  <DesignCanvas
    title="UnityAILab — Landing Page Redesign"
    subtitle="Four directions on the brand. Same content, four moods. Click any board to focus."
  >
    <DCSection id="heroes" title="Hero Variations">
      <DCArtboard id="va" label="A · Terminal / Grimoire" width={1280} height={2400}>
        <ArtboardWrap><TerminalHero /></ArtboardWrap>
      </DCArtboard>
      <DCArtboard id="vb" label="B · Editorial Dark" width={1280} height={2400}>
        <ArtboardWrap><EditorialHero /></ArtboardWrap>
      </DCArtboard>
      <DCArtboard id="vc" label="C · Live Demo Hero" width={1280} height={2400}>
        <ArtboardWrap><LiveDemoHero /></ArtboardWrap>
      </DCArtboard>
      <DCArtboard id="vd" label="D · Push the Gothic" width={1280} height={2400}>
        <ArtboardWrap><GothicHero /></ArtboardWrap>
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
