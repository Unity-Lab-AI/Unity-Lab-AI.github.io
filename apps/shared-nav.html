<!--
  Unity AI Lab — Shared Apps Nav (gothic redesign chrome, static include)
  Mirrors GothicNavbar from redesign/v-d-chrome.jsx using the same
  `.vD-nav-*` class names from redesign/variations.css. Use this file ONLY
  if you want a static include instead of the JS-injected version. Most
  apps load apps/shared-nav.js — this file is kept for reference + parity.

  Required CSS (auto-loaded by shared-nav.js, manual on static include):
    <link rel="stylesheet" href="/redesign/shared-tokens.css" />
    <link rel="stylesheet" href="/redesign/variations.css" />
-->
<nav class="vD-nav" role="navigation" aria-label="Main navigation">
    <div class="vD-nav-inner">
        <a href="/" class="vD-nav-brand" aria-label="Unity AI Lab home">
            <span class="vD-nav-mark">
                <svg width="26" height="26" viewBox="0 0 64 64" fill="none"
                     stroke="currentColor" stroke-width="1.4"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M 36 12 A 22 22 0 1 0 50 22"/>
                    <path d="M 16 22 Q 14 32 16 42" stroke-opacity="0.45"/>
                    <path d="M 22 14 Q 32 12 42 14" stroke-opacity="0.45"/>
                    <path d="M 48 24 Q 52 32 48 42" stroke-opacity="0.45"/>
                    <path d="M 22 50 Q 32 52 42 50" stroke-opacity="0.45"/>
                    <path d="M 50 22 L 42 18 L 38 24 L 36 12 Z" fill="currentColor" stroke="none"/>
                    <circle cx="44" cy="20" r="1" fill="#0a0a0a" stroke="none"/>
                    <line x1="13" y1="32" x2="10" y2="32" stroke-opacity="0.4"/>
                    <line x1="32" y1="13" x2="32" y2="10" stroke-opacity="0.4"/>
                    <line x1="51" y1="32" x2="54" y2="32" stroke-opacity="0.4"/>
                    <line x1="32" y1="51" x2="32" y2="54" stroke-opacity="0.4"/>
                </svg>
            </span>
            <span class="vD-nav-name">UNITYAILAB</span>
        </a>
        <button class="vD-nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <ul class="vD-nav-list">
            <li><a href="/ai">AI</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/apps">Apps</a></li>
            <li><a href="/services">Services</a></li>
            <li><a href="/projects">Projects</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </div>
</nav>
<script>
    // Scroll-state class — matches the React GothicNavbar threshold.
    (function () {
        var nav = document.currentScript && document.currentScript.previousElementSibling
            ? document.currentScript.previousElementSibling.previousElementSibling || document.querySelector('nav.vD-nav')
            : document.querySelector('nav.vD-nav');
        if (!nav) return;
        var onScroll = function () {
            if (window.scrollY > 30) nav.classList.add('vD-nav-scrolled');
            else nav.classList.remove('vD-nav-scrolled');
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        // Mobile menu toggle.
        var toggle = nav.querySelector('.vD-nav-toggle');
        var list   = nav.querySelector('.vD-nav-list');
        if (toggle && list) {
            toggle.addEventListener('click', function () {
                var open = list.classList.toggle('open');
                toggle.classList.toggle('on', open);
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
        }
    })();
</script>
